plugins {
    // 26.x 起用 net.fabricmc.fabric-loom 这个新插件 ID（无映射模式）；
    // 旧的 fabric-loom 插件要求必须配置映射，会报 "Configuration 'mappings' has no dependencies"
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Chinese mirrors for faster downloads
    maven {
        name = 'Alibaba Central'
        url = 'https://maven.aliyun.com/repository/central'
    }
    maven {
        name = 'Alibaba Public'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
}

dependencies {
    // Fabric & Minecraft（26.x 起 Mojang 不再混淆代码，无需任何映射）
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
